# Each entry changes ONE parameter from nominal. Everything else = nominal values.
# Nominal: friction=0.8, mass=0.5, delay=0.0, kp=500, kd=50, offset=0.0, speed=0.3

perturbations:

  - scenario_id: "low_friction"
    friction: 0.15
    object_mass: 0.5
    action_delay: 0.0
    kp: 500.0
    kd: 50.0
    pose_offset: 0.0
    lift_speed: 0.3
    num_episodes: 7
    random_seed: 42

  - scenario_id: "pose_error"
    friction: 0.8
    object_mass: 0.5
    action_delay: 0.0
    kp: 500.0
    kd: 50.0
    pose_offset: 0.06
    lift_speed: 0.3
    num_episodes: 7
    random_seed: 42

  - scenario_id: "low_gain"
    friction: 0.8
    object_mass: 0.5
    action_delay: 0.0
    kp: 30.0
    kd: 3.0
    pose_offset: 0.0
    lift_speed: 0.3
    num_episodes: 7
    random_seed: 42

  - scenario_id: "action_delay"
    friction: 0.8
    object_mass: 0.5
    action_delay: 0.15
    kp: 500.0
    kd: 50.0
    pose_offset: 0.0
    lift_speed: 0.3
    num_episodes: 7
    random_seed: 42

  - scenario_id: "heavy_object"
    friction: 0.8
    object_mass: 8.0
    action_delay: 0.0
    kp: 500.0
    kd: 50.0
    pose_offset: 0.0
    lift_speed: 0.3
    num_episodes: 7
    random_seed: 42

  - scenario_id: "fast_lift"
    friction: 0.8
    object_mass: 0.5
    action_delay: 0.0
    kp: 500.0
    kd: 50.0
    pose_offset: 0.0
    lift_speed: 2.0
    num_episodes: 7
    random_seed: 42
